# Configurazione Training per TorchMD-Net
# Lanciare con: python -m torchmdnet.scripts.train --conf train.yaml

# ---- Dataset ----
dataset: Custom
coord_files: "dataset_pos.npy"
embed_files: "dataset_z.npy"
force_files: "dataset_dy.npy"

# ---- Architettura del Modello ----
model: graph-network
num_layers: 3
embedding_dimension: 128
num_rbf: 50
rbf_type: "expnorm"
trainable_rbf: true
activation: "silu"
cutoff_lower: 0.0
cutoff_upper: 0.9
max_z: 100
max_num_neighbors: 100
aggr: "add"

# ---- Prior (Opzionale, delta-learning nativo) ----
# In questo caso i prior li abbiamo già sottratti fisicamente nel dataset (Delta forces),
# quindi non attiviamo prior models dinamici qui.
prior_model: null

# ---- Loss & Pesi ----
# Poiché addestriamo su coarse-graining, abbiamo solo le Forze.
derivative: true
y_weight: 0.0
neg_dy_weight: 1.0

# ---- Ottimizzazione ----
standardize: false
gradient_clipping: 1.0
batch_size: 16
lr: 0.0001
lr_patience: 10
lr_factor: 0.5
lr_min: 0.000001
weight_decay: 0.0

# ---- Esecuzione ----
num_epochs: 500
log_dir: "logs"
val_size: 0.2
test_size: 0.0
seed: 42
